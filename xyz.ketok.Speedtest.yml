app-id: xyz.ketok.Speedtest
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: speedtest

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=ipc
  - --share=network

modules:
  - python3-expandvars.json
  - python3-aiohttp.json

  - name: speedtest
    builddir: true
    buildsystem: meson
    sources:
      - type: git
        url: https://github.com/Ketok4321/speedtest
        tag: v1.4.0
        commit: f71d352acc0da5d50c592cf2557d968394138822
